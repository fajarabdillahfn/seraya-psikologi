name = "seraya-psikologi"
main = "app/src/worker/index.ts"
compatibility_date = "2024-08-21"
compatibility_flags = ["nodejs_compat"]

# Placeholder runtime. Real account id, route, and secrets are configured
# in `.dev.vars` (local) and CF dashboard (production). See ADR 0089.
# account_id is intentionally commented; add it before deploy.

# Routes / Bindings

[[d1_databases]]
binding = "DB"
database_name = "seraya-db"
database_id = "8f193be1-59da-42ba-8ef7-9494cdd18f8c" # set via `wrangler d1 create seraya-db`
migrations_dir = "app/migrations"

# Placeholder variables for secrets used by the Worker at runtime.
# These are illustrative; actual values live in CF Workers Secrets and
# `.dev.vars` (gitignored). Documented in ADR 0089 §10.
#
# vars = { ENVIRONMENT = "development" }

# Real production requires:
# - Google OAuth client id/secret (secret)
# - Email provider API key (secret)
# - Inter-service signing key (secret)
# - WhatsApp manual payment config (vars, not secret):
#     ADMIN_WHATSAPP_NUMBER, SERAYA_BANK_NAME, SERAYA_BANK_ACCOUNT,
#     SERAYA_BANK_HOLDER, SERAYA_QRIS_IMAGE_URL
# All set with `wrangler secret put <NAME>` (for secret) or
# `[vars]` block (for non-secret payment config).

[observability]
enabled = true